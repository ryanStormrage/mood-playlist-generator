name: Build song data

on:
  push:
    branches: [main]
    paths: ["prepare_data.py", ".github/workflows/data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download dataset and split by genre
        run: python prepare_data.py
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/genres.json data/genres
          git diff --cached --quiet || git commit -m "Build song data"
          git push
